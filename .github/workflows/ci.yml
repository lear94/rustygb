name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p rusty_gb_wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --doc
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --release
      - run: cargo build --locked --release -p rusty_gb_wasm --target wasm32-unknown-unknown
      - run: node --input-type=module --check < web/main.js
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --locked
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - run: cargo test --locked --test fuzz
        env:
          PROPTEST_CASES: 1000
          FUZZ_SEED: ${{ github.run_id }}
  bench:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - run: scripts/bench_gate.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: cargo install --locked cargo-audit && cargo audit --deny unsound --deny yanked
