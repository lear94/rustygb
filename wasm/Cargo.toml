[package]
name = "rusty_gb_wasm"
version = "1.0.0"
edition = "2021"
rust-version = "1.98"
description = "WebAssembly bindings of the RustyGB emulator"
license = "MIT"
repository = "https://github.com/lear94/rustygb"

# Its own crate: a cdylib next to the desktop binary would keep Cargo from building
# both the abort and the unwind variants of the core.
[lib]
crate-type = ["cdylib"]

[dependencies]
rusty_gb = { path = ".." }
# JavaScript bindings.
wasm-bindgen = { version = "0.2", default-features = false, features = ["std"] }
# Readable panics in the browser console.
console_error_panic_hook = "0.1"

[lints]
workspace = true
