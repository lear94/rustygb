[package]
name = "rusty_gb"
version = "1.0.0"
edition = "2021"
rust-version = "1.98"
description = "Game Boy (DMG) emulator written from scratch in Rust"
license = "MIT"
repository = "https://github.com/lear94/rustygb"

[lib]
name = "rusty_gb"
path = "src/lib.rs"
bench = false
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rusty_gb"
path = "src/main.rs"
bench = false

# Native (desktop) front-end dependencies.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# GPU-scaled pixel buffer.
pixels = "0.13.0"
# Window and event loop; the version `pixels` 0.13 shares raw-window-handle with.
winit = "0.28.7"
# Keyboard state tracking on top of winit events.
winit_input_helper = "0.14.0"
# Cross-platform audio output.
cpal = "0.15.2"
# Lock-free bounded channel: the audio callback must not block.
crossbeam-channel = "0.5.8"

# WebAssembly front-end dependencies.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# JavaScript bindings.
wasm-bindgen = "0.2"
# Readable panics in the browser console.
console_error_panic_hook = "0.1"

[dev-dependencies]
# Statistical benchmarks with stored baselines; `std` has no stable harness.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "run_frame"
harness = false

[lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
float_cmp = "deny"
cognitive_complexity = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# No `panic = "abort"`: with a cdylib, Cargo gives the abort and unwind builds of this
# library the same file name, so the bench target cannot link.
