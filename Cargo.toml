[package]
name = "rusty_gb"
version = "1.0.0"
edition = "2021"
rust-version = "1.98"
description = "Game Boy (DMG) emulator written from scratch in Rust"
license = "MIT"
repository = "https://github.com/lear94/rustygb"

[lib]
name = "rusty_gb"
path = "src/lib.rs"
bench = false

[[bin]]
name = "rusty_gb"
path = "src/main.rs"
bench = false

# Native (desktop) front-end dependencies.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# GPU-scaled pixel buffer.
pixels = "0.13.0"
# Window and event loop; the version `pixels` 0.13 shares raw-window-handle with.
winit = "0.28.7"
# Cross-platform audio output.
cpal = "0.15.2"
# Lock-free bounded channel: the audio callback must not block.
crossbeam-channel = "0.5.8"

[dev-dependencies]
# Statistical benchmarks with stored baselines; `std` has no stable harness.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "run_frame"
harness = false

[lints]
workspace = true

[workspace]
members = ["wasm"]

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
float_cmp = "deny"
cognitive_complexity = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
