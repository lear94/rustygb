[package]
name = "rusty_gb"
version = "1.0.0"
edition = "2021"
rust-version = "1.98"
description = "Game Boy (DMG) emulator written from scratch in Rust"
license = "MIT"
repository = "https://github.com/lear94/rustygb"

[lib]
name = "rusty_gb"
path = "src/lib.rs"
bench = false

[[bin]]
name = "rusty_gb"
path = "src/main.rs"
bench = false

# Native (desktop) front-end dependencies.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# GPU-scaled pixel buffer.
pixels = { version = "0.17.2", default-features = false }
# Window and event loop. Client-side decorations show the title, which reports failures.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
# Cross-platform audio output.
cpal = { version = "0.18.2", default-features = false }
# Lock-free bounded channel: the audio callback must not block.
crossbeam-channel = { version = "0.5.8", default-features = false, features = ["std"] }

[dev-dependencies]
# Counting allocator; writing one needs `unsafe`, forbidden here.
allocation-counter = "0.8"
# Statistical benchmarks with stored baselines; `std` has no stable harness.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Property tests and in-tree fuzzing with shrinking; `std` offers neither.
proptest = { version = "1.7", default-features = false, features = ["std"] }

[[bench]]
name = "run_frame"
harness = false

[lints]
workspace = true

[workspace]
members = ["wasm"]

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
float_cmp = "deny"
cognitive_complexity = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
